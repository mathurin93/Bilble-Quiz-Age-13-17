<script>
"use strict";
const lessons = [
  {
    "n": 11,
    "title": "Questions, faith, and rest",
    "topic": "John’s question and Jesus’ invitation",
    "intro": "John sends an important question to Jesus, and Jesus points to what people can see and hear. The chapter ends with an invitation to learn from him and find rest.",
    "memory": "28–30",
    "theme": "Bring your burdens to Jesus and learn from his gentleness.",
    "remember": [
      "John sends his question while he is in prison.",
      "Chorazin, Bethsaida, and Capernaum receive warnings.",
      "Jesus connects rest with coming to him and learning from him."
    ],
    "discuss": "What is one question you could bring honestly to Jesus, and one way you could explore it in Scripture?",
    "sections": [
      [
        "1–6",
        "John asks about Jesus",
        "While John is in prison, he sends two disciples to ask whether Jesus is the expected one. Jesus tells them to report the healings and the good news being shared with people in need."
      ],
      [
        "7–19",
        "Recognising the messenger",
        "Jesus describes John as the messenger who prepares the way. He challenges a generation that finds excuses to reject both John’s strict lifestyle and Jesus’ welcome of others."
      ],
      [
        "20–24",
        "Responding to what you see",
        "Jesus warns towns that have seen many miracles but have not turned back to God. Seeing something remarkable is not the same as responding to it."
      ],
      [
        "25–30",
        "Learning from Jesus",
        "Jesus praises the Father for revealing truth to the humble. He invites worn-out people to come to him, learn his gentle way, and receive rest."
      ]
    ]
  },
  {
    "n": 12,
    "title": "Mercy and the heart",
    "topic": "The Sabbath, signs, and family",
    "intro": "Questions about the Sabbath become a wider challenge about Jesus’ authority. Jesus explains that our words and actions reveal what is happening inside us.",
    "memory": "34–35",
    "theme": "The words we speak reflect what is stored in our hearts.",
    "remember": [
      "Jesus uses the example of rescuing a sheep to explain doing good on the Sabbath.",
      "A tree’s fruit illustrates the connection between character and words.",
      "Jesus identifies obedience to the Father as a mark of his family."
    ],
    "discuss": "How could you show mercy in a situation where people are focusing only on rules?",
    "sections": [
      [
        "1–14",
        "Mercy on the Sabbath",
        "Hungry disciples pick grain, and Jesus heals a man’s hand. When religious leaders object, Jesus points to Scripture and shows that doing good belongs on the Sabbath."
      ],
      [
        "15–21",
        "The promised servant",
        "Jesus continues healing people and avoids drawing attention to himself. Matthew connects his work with Isaiah’s picture of God’s servant bringing justice and hope."
      ],
      [
        "22–37",
        "A divided kingdom cannot stand",
        "After a healing, opponents accuse Jesus of working with evil power. He exposes the problem in their argument and teaches that speech reveals the heart; words carry responsibility."
      ],
      [
        "38–45",
        "The sign of Jonah",
        "Some leaders demand a sign. Jesus points to Jonah and warns that a response to God must be deeper than an impressive outward change."
      ],
      [
        "46–50",
        "The family of Jesus",
        "When his mother and brothers arrive, Jesus points to his disciples. He describes those who do the Father’s will as belonging to his family."
      ]
    ]
  },
  {
    "n": 13,
    "title": "Stories of the kingdom",
    "topic": "Soils, seeds, treasure, and a pearl",
    "intro": "Jesus uses everyday pictures to teach about God’s kingdom. Listen for the difference between simply hearing his message and allowing it to shape your life.",
    "memory": "23",
    "theme": "Receive and understand God’s message so that it produces a changed life.",
    "remember": [
      "In the seed story, good soil represents hearing and understanding.",
      "The wheat-and-tares harvest points to the end of the age.",
      "Both the treasure finder and the pearl merchant sell everything to obtain what they value."
    ],
    "discuss": "Which distraction most often stops you from paying attention to what you read? What small change could help?",
    "sections": [
      [
        "1–23",
        "Four kinds of ground",
        "From a boat, Jesus tells a story about seed landing on different ground. His explanation connects the ground with responses to the kingdom message: losing it, giving up, becoming distracted, or understanding and producing a crop."
      ],
      [
        "24–30",
        "Wheat and tares",
        "An enemy plants tares (weeds) among a farmer’s wheat. The farmer tells the workers to wait for harvest so they do not damage the wheat while removing tares."
      ],
      [
        "31–35",
        "Small beginnings, growing influence",
        "A mustard seed grows into a large plant, and leaven (yeast) spreads through dough. These short pictures describe the kingdom with things that begin small and have a much wider effect."
      ],
      [
        "36–43",
        "Jesus explains the harvest",
        "In private, Jesus identifies the people and events in the wheat-and-tares story. The harvest represents the end of the age, and the harvesters are angels."
      ],
      [
        "44–52",
        "Value, choices, and understanding",
        "Hidden treasure and a valuable pearl show the kingdom’s great worth. A fishing net pictures a final separation, and a householder uses both old and new treasures."
      ],
      [
        "53–58",
        "Rejection at home",
        "People in Jesus’ hometown know his family and question where his wisdom comes from. Their familiarity does not lead to faith, and he does few miracles there."
      ]
    ]
  },
  {
    "n": 14,
    "title": "Compassion in the storm",
    "topic": "A shared meal and a night on the lake",
    "intro": "After John’s death, Jesus continues caring for the crowds and his disciples. A shared meal and a storm reveal his compassion and authority.",
    "memory": "27",
    "theme": "Jesus speaks courage to his frightened disciples.",
    "remember": [
      "The feeding in chapter 14 starts with five loaves and two fish.",
      "Twelve baskets remain after about five thousand men, besides women and children, have eaten.",
      "Peter begins to sink after he notices the wind and becomes afraid."
    ],
    "discuss": "When you feel overwhelmed, what would it look like to ask for help instead of pretending you are fine?",
    "sections": [
      [
        "1–12",
        "The death of John",
        "Herod hears about Jesus and wrongly connects him with John returning to life. Matthew explains how Herod had ordered John’s death; John’s disciples bury him and tell Jesus."
      ],
      [
        "13–21",
        "Food for the crowd",
        "Jesus responds with compassion to the people who follow him. Five loaves and two fish become a meal for about five thousand men, besides women and children, and twelve baskets of pieces remain."
      ],
      [
        "22–33",
        "Jesus on the water",
        "Jesus prays alone while the disciples travel by boat. He comes to them across the water; Peter begins walking toward him, becomes afraid, and is rescued when he calls for help."
      ],
      [
        "34–36",
        "Healing at Gennesaret",
        "After they land, people recognise Jesus and bring those who are ill. Those who touch the hem of his garment are healed."
      ]
    ]
  },
  {
    "n": 15,
    "title": "A clean heart and persistent faith",
    "topic": "Tradition, faith, and a second feeding",
    "intro": "Jesus challenges a tradition that is being used to avoid God’s command. He also welcomes a persistent request for help and feeds another large crowd.",
    "memory": "18–20",
    "theme": "Pay attention to the heart behind your words and choices.",
    "remember": [
      "The handwashing dispute concerns a religious tradition.",
      "The Canaanite woman asks for help for her daughter.",
      "Chapter 15 has four thousand men, seven loaves, and seven leftover baskets."
    ],
    "discuss": "What is the difference between looking respectful and treating someone with real respect?",
    "sections": [
      [
        "1–9",
        "Tradition and obedience",
        "Leaders question the disciples’ ceremonial handwashing. Jesus challenges a practice that lets people avoid supporting their parents, and he warns about honouring God with words while the heart stays distant."
      ],
      [
        "10–20",
        "What makes a person unclean?",
        "Jesus explains that wrongdoing begins in the heart. His point concerns moral uncleanness, not whether everyday hygiene matters."
      ],
      [
        "21–28",
        "A mother keeps asking",
        "In the region of Tyre and Sidon, a Canaanite woman asks Jesus to help her daughter. Jesus recognises her great faith, and her daughter is healed."
      ],
      [
        "29–39",
        "Healing and another shared meal",
        "Near the Sea of Galilee, Jesus heals many people. After the crowd has stayed for three days, he feeds four thousand men, besides women and children, using seven loaves and a few small fish; seven baskets remain."
      ]
    ]
  },
  {
    "n": 16,
    "title": "Who do you say Jesus is?",
    "topic": "Peter’s confession and the cost of following",
    "intro": "Peter recognises Jesus as the Christ (Messiah), but still struggles with the path Jesus describes. Jesus teaches that following him involves costly trust, not only the right words.",
    "memory": "24–25",
    "theme": "Following Jesus means trusting him enough to put him ahead of self-interest.",
    "remember": [
      "Peter’s confession takes place in the region of Caesarea Philippi.",
      "The leaven warning is about teaching, not missing bread.",
      "Jesus predicts both his death and his resurrection."
    ],
    "discuss": "What is a small, practical choice where following Jesus might cost you popularity or convenience?",
    "sections": [
      [
        "1–12",
        "A demand and a warning",
        "Leaders ask for a sign, and Jesus again points to Jonah. When he warns about their leaven (yeast), the disciples first think about food, then realise he means their teaching."
      ],
      [
        "13–20",
        "Peter’s answer",
        "Near Caesarea Philippi, Jesus asks what people say about him and then asks the disciples directly. Peter identifies him as the Christ and Son of the living God; Jesus says the Father has revealed this. Jesus speaks about building his church and giving Peter the keys of the kingdom."
      ],
      [

 <div class="weeks mt-4">${planWeeks().map((week,w)=>`<section class="panel"><div class="eyebrow">Week ${w+1}</div><h2>${["Read and retell","Look for connections","Practice recall","Review for quiz day"][w]}</h2>
 ${week.map(([task,path],i)=>{const d=w*5+i;return `<div class="day"><label class="check"><input type="checkbox" data-list="days" value="${d}" ${state.days.includes(d)?"checked":""}>
 <span><b>Day ${d+1}</b> · ${task}</span></label>${link(path,"Open activity →")}</div>`;}).join("")}</section>`).join("")}</div>
 <section class="panel"><h2>Memory passages</h2>${chapters.map(c=>`<div class="row"><label class="check"><input type="checkbox" data-list="memory" value="${c.n}" ${state.memory.includes(c.n)?"checked":""}>I can recite Matthew ${c.n}:${c.memory}</label>${bible(c.n+":"+c.memory,"Read this passage")}</div>`).join("")}</section>`;
}
function progressView(){
 return title("My progress","Your learning is adding up.","Use your results to choose a chapter to revisit.")+stats()+
 `<div class="twocol"><section class="panel"><h2>Chapter by chapter</h2>${chapters.map(c=>{
  const qs=bank.filter(q=>q.n===c.n),learned=qs.filter(q=>state.known.includes(q.ref)).length;
  const answers=state.history.flatMap(r=>r.answers.filter((_,i)=>byRef.get(r.ids[i]).n===c.n));
  return `<div class="row">${link("study/"+c.n,"Matthew "+c.n+" · "+c.title)}<p>${state.read.includes(c.n)?"✓ Studied":"Ready to read"} · ${learned}/${qs.length} cards learned</p>
  <small>${answers.length?percent(answers.filter(a=>a===0).length,answers.length)+"% correct in quizzes":"No quiz answers yet"}</small></div>`;
 }).join("")}</section><div><section class="panel warm"><h2>Quiz history</h2>${state.run?link("quiz","Resume unfinished quiz　→"):""}
 ${state.history.length?state.history.slice(0,12).map(r=>`<div class="row">${link("result/"+r.date,new Date(r.date).toLocaleDateString()+" · "+r.mode+" · "+score(r)+"/"+r.ids.length)}</div>`).join(""):"<p>Your completed quizzes will appear here.</p>"}
 ${state.review.length?button("retry","Practice "+state.review.length+" to review","link mt-4"):""}</section>
 <section class="panel"><h3>Your progress backup</h3><p>Copy or restore this class’s progress on another device.</p>${button("backup","Back up or restore","quiet mt-4")}</section></div></div>`;
}
function dialog(heading,body){
 $("help").innerHTML=`<div class="flex items-center justify-between gap-3"><h2 id="helpTitle">${heading}</h2>${button("close","×","round")}</div>${body}`;
 if(!$("help").open)$("help").showModal();
}
function help(){
 dialog("Teacher notes",`<p><b>Ages ${ages()} · Matthew ${rangeName()} · NKJV</b></p>
 <p>Read a passage together. Have one student retell it, another name a detail, and a third find the supporting verse. Finish with a short quiz and revisit any missed answers.</p>
 <p>The study notes use original wording. Open the full-chapter reader in each guide for the NKJV text. Full chapters use an internet connection.</p>
 <label class="field">Study text size<select id="textSize">${[18,20,22].map(n=>option(n,n+" px",state.size)).join("")}</select></label>
 <p class="meta">Suggested memory passages and practice questions are for class study. Use your organizer’s list for competition day. NKJV © 1982 Thomas Nelson. Online reader provided by Biblia.</p>`);
}
function backup(){
 dialog("Class progress backup",`<p>Keep a copy of this text. To restore a backup for ages ${ages()}, paste it here and choose Restore.</p>
 <textarea id="backupText" aria-label="Progress backup" rows="7" style="width:100%;font:16px monospace"></textarea>
 <div class="flex flex-wrap gap-3 mt-4">${button("copy","Copy backup")}${button("restore","Restore","quiet")}</div><p id="backupMsg" role="status"></p>`);
 $("backupText").value=JSON.stringify({app:"Matthew Quest",version:1,group,state});
}
function restore(){
 try{
  const b=JSON.parse($("backupText").value);
  if(b.app!=="Matthew Quest"||b.version!==1||b.group!==group||!validState(b.state))throw Error();
  if(!confirm("Replace this class’s saved progress with the backup?"))return;
  state=b.state;save();resetDeck();$("help").close();draw();tick();
 }catch{$("backupMsg").textContent="Paste a complete progress backup from this age group.";}
}
function draw(){
 nav();document.documentElement.style.setProperty("--reading",state.size+"px");
 const views={study:()=>chapter(arg)?lesson(chapter(arg)):homeView(),quiz:()=>state.run?liveQuiz():setupView(),result:results,cards:flashcards,plan,progress:progressView};
 $("main").innerHTML=(storageOK?"":'<p class="panel warm">This browser can keep progress for this visit. Use a progress backup to keep it for later.</p>')+views[page]();
 const reader=$("reader");
 if(reader)reader.ontoggle=()=>{
  if(!reader.isConnected||!reader.open||$("frameSlot").firstChild)return;
  const n=chapter(arg).n,frame=document.createElement("iframe");
  frame.title="Matthew "+n+" in the New King James Version";
  frame.src="https://biblia.com/api/plugins/embeddedbible?layout=normal&resourceName=NKJV&resourcePicker=false&startingReference=Mt"+n+".1";
  $("frameSlot").append(frame);
 };
}
document.addEventListener("click",async e=>{
 const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
 const action=el.dataset.act,v=el.dataset.value;
 if(["pick","answer","skip","next"].includes(action)&&state.run?.until&&Date.now()>=state.run.until){finish(true);return;}
 switch(action){
 case "help":help();break;
 case "close":$("help").close();break;
 case "read":state.read=toggle(state.read,Number(v));save();draw();break;
 case "mode":setup.mode=v;draw();break;
 case "mixed":start(sample(bank).slice(0,10).map(q=>q.ref));break;
 case "start":{
  const mock=setup.mode==="mock",pool=bank.filter(q=>!setup.scope||q.n===setup.scope);
  start(mock?mockIds():sample(pool).slice(0,setup.count).map(q=>q.ref),setup.mode,mock&&setup.timed);break;
 }
 case "pick":if(state.run&&state.run.answers.length===state.run.pos){state.run.pick=Number(v);save();draw();document.querySelector('[data-act="answer"]').focus({preventScroll:true});}break;
 case "answer":answer(false);break;
 case "skip":answer(true);break;
 case "next":next();break;
 case "retry":start(sample(state.review));break;
 case "miss":{const r=currentResult();start(sample(r.ids.filter((_,i)=>r.answers[i]!==0)));break;}
 case "flip":flipped=!flipped;draw();document.querySelector(".flash")?.focus({preventScroll:true});break;
 case "learn":rate(true);break;
 case "again":rate(false);break;
 case "prevCard":at=Math.max(0,at-1);flipped=false;draw();break;
 case "nextCard":at++;flipped=false;draw();break;
 case "shuffle":resetDeck();draw();break;
 case "allCards":cardFilter="all";cardScope=0;resetDeck();go("cards");break;
 case "backup":backup();break;
 case "copy":
  $("backupText").select();
  try{await navigator.clipboard.writeText($("backupText").value);$("backupMsg").textContent="Copied.";}
  catch{$("backupMsg").textContent="The backup text is selected. Use your device’s Copy command.";}break;
 case "restore":restore();break;
 }
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.list){const name=el.dataset.list,n=Number(el.value);state[name]=toggle(state[name],n,el.checked);save();draw();document.querySelector('[data-list="'+name+'"][value="'+n+'"]')?.focus({preventScroll:true});return;}
 switch(el.id){
 case "quizScope":setup.scope=Number(el.value);setup.count=setup.scope?8:10;draw();break;
 case "count":setup.count=Number(el.value);break;
 case "timed":setup.timed=el.checked;break;
 case "cardScope":cardScope=Number(el.value);resetDeck();draw();break;
 case "cardFilter":cardFilter=el.value;resetDeck();draw();break;
 case "textSize":state.size=Number(el.value);save();document.documentElement.style.setProperty("--reading",state.size+"px");break;
 }
});
document.querySelector(".skip").onclick=e=>{e.preventDefault();$("main").focus();};
$("logo").innerHTML=icon("book");$("sprout").innerHTML=icon("sprout");
window.addEventListener("hashchange",route);setInterval(tick,500);loadClass();route();
</script>
</body>
</html>
